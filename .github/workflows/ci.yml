name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Runtime E2E
        run: xvfb-run -a pnpm run e2e:runtime

      - name: Accessibility E2E
        run: xvfb-run -a pnpm run e2e:accessibility

      - name: Backup E2E
        run: xvfb-run -a pnpm run e2e:backup

      - name: Package Linux Artifact
        run: pnpm run package:linux

      - name: Verify Linux Package
        run: pnpm run package:verify

      - name: Packaged E2E
        run: xvfb-run -a pnpm run e2e:packaged
