name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_title="ChronoPic ${RELEASE_TAG}"
          release_notes="Automated ChronoPic Flutter release for ${RELEASE_TAG}. Electron desktop assets are no longer produced."

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${release_title}" \
              --notes "${release_notes}"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${release_title}" \
              --notes "${release_notes}"
          fi

  flutter-android:
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        run: |
          set -euo pipefail
          git clone https://github.com/flutter/flutter.git --branch stable --depth 1 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter validation
        run: |
          set -euo pipefail
          flutter doctor -v
          cd chronopic_flutter
          flutter pub get
          dart analyze packages/chronopic_media packages/chronopic_app packages/chronopic_ui apps/chronopic
          dart test packages/chronopic_media/test packages/chronopic_app/test
          flutter test \
            packages/chronopic_ui/test/chronopic_home_test.dart \
            packages/chronopic_ui/test/linux_desktop_parity_test.dart \
            packages/chronopic_ui/test/mobile_productization_test.dart

      - name: Build Android release artifacts
        env:
          CHRONOPIC_ANDROID_KEYSTORE_BASE64: ${{ secrets.CHRONOPIC_ANDROID_KEYSTORE_BASE64 }}
          CHRONOPIC_ANDROID_STORE_PASSWORD: ${{ secrets.CHRONOPIC_ANDROID_STORE_PASSWORD }}
          CHRONOPIC_ANDROID_KEY_ALIAS: ${{ secrets.CHRONOPIC_ANDROID_KEY_ALIAS }}
          CHRONOPIC_ANDROID_KEY_PASSWORD: ${{ secrets.CHRONOPIC_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            CHRONOPIC_ANDROID_KEYSTORE_BASE64 \
            CHRONOPIC_ANDROID_STORE_PASSWORD \
            CHRONOPIC_ANDROID_KEY_ALIAS \
            CHRONOPIC_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Android release secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          store_file="$RUNNER_TEMP/chronopic-upload-keystore.jks"
          printf '%s' "$CHRONOPIC_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$store_file"

          CHRONOPIC_ANDROID_STORE_FILE="$store_file" \
          CHRONOPIC_ANDROID_STORE_PASSWORD="$CHRONOPIC_ANDROID_STORE_PASSWORD" \
          CHRONOPIC_ANDROID_KEY_ALIAS="$CHRONOPIC_ANDROID_KEY_ALIAS" \
          CHRONOPIC_ANDROID_KEY_PASSWORD="$CHRONOPIC_ANDROID_KEY_PASSWORD" \
            chronopic_flutter/tool/release/build_android_release.sh

          node chronopic_flutter/tool/release/verify_flutter_release_artifacts.mjs android

      - name: Upload Android release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/flutter-release/android/* --repo "${GITHUB_REPOSITORY}" --clobber

  flutter-linux:
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter stable
        run: |
          set -euo pipefail
          git clone https://github.com/flutter/flutter.git --branch stable --depth 1 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build Linux release artifact
        run: |
          set -euo pipefail
          flutter doctor -v
          chronopic_flutter/tool/release/build_linux_release.sh
          node chronopic_flutter/tool/release/verify_flutter_release_artifacts.mjs linux

      - name: Upload Linux release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/flutter-release/linux/* --repo "${GITHUB_REPOSITORY}" --clobber
